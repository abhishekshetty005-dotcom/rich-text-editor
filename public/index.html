<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rich Text Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Documents</h1>
      <button id="new-doc" class="primary" title="New document">+ New</button>
    </div>
    <ul id="doc-list" class="doc-list"></ul>
  </aside>

  <main class="main">
    <header class="doc-header">
      <input id="title" class="title" placeholder="Untitled" maxlength="200" aria-label="Document title">
      <span id="status" class="status"></span>
      <button id="delete-doc" class="danger" title="Delete document">Delete</button>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Formatting">
      <select id="block-format" title="Text style">
        <option value="p">Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code block</option>
      </select>
      <span class="sep"></span>
      <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
      <label class="color" title="Text color">A<input type="color" id="fore-color" value="#d33"></label>
      <label class="color highlight" title="Highlight">H<input type="color" id="hilite-color" value="#ffeb3b"></label>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="Bulleted list">&bull; List</button>
      <button data-cmd="insertOrderedList" title="Numbered list">1. List</button>
      <button data-cmd="outdent" title="Decrease indent">&#8676;</button>
      <button data-cmd="indent" title="Increase indent">&#8677;</button>
      <span class="sep"></span>
      <button data-cmd="justifyLeft" title="Align left">&#8676;&#8801;</button>
      <button data-cmd="justifyCenter" title="Align center">&#8801;</button>
      <button data-cmd="justifyRight" title="Align right">&#8801;&#8677;</button>
      <span class="sep"></span>
      <button id="link" title="Insert link (Ctrl+K)">Link</button>
      <button data-cmd="unlink" title="Remove link">Unlink</button>
      <button data-cmd="insertHorizontalRule" title="Horizontal line">&mdash;</button>
      <button data-cmd="removeFormat" title="Clear formatting">Clear</button>
      <span class="sep"></span>
      <button data-cmd="undo" title="Undo (Ctrl+Z)">&#8630;</button>
      <button data-cmd="redo" title="Redo (Ctrl+Y)">&#8631;</button>
    </div>

    <div id="editor" class="editor" contenteditable="true" spellcheck="true" aria-label="Document body"></div>

    <footer class="footer">
      <span id="counts">0 words &middot; 0 characters</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
